name: Vex build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.work/tmp
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/.work/tmp
      CI: "true"
    steps:
      - name: Prepare temporary directory
        run: mkdir -p "$GITHUB_WORKSPACE/.work/tmp"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: false
      - name: Prepare build temporary directory
        run: mkdir -p "$GITHUB_WORKSPACE/.work/tmp"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build project
        run: ./gradlew build --no-daemon
      - uses: imdomestic/vex-action@8ff4dbed05ef06d4341ed51c6b53c99f88bcb158
        with:
          mode: build
          artifact: vex-build
