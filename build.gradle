plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
}

version = project.mod_version
group = 'com.imdomestic.vex.example'

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger()) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'java_version', project.java_version
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    filesMatching('fabric.mod.json') {
        expand version: project.version,
            minecraft_version: project.minecraft_version,
            java_version: project.java_version,
            fabric_loader_version: project.fabric_loader_version
    }
}
test { useJUnitPlatform() }
